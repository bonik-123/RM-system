<div class="student-dashboard">
  <section class="hero-card">
    <div>
      <p class="eyebrow">Dashboard</p>
      <h1>Hello, Student President!</h1>
      <p>Manage your classroom maintenance reports efficiently.</p>
    </div>
    <button class="primary-button">New Report</button>
  </section>

  <div class="dashboard-grid">
    <article class="info-card">
      <h2>Quick Room Info</h2>
      <p>Check current room status and layout.</p>
      <div class="search-row">
        <input type="text" placeholder="Search room (e.g., A-101)" />
      </div>
      <div class="room-preview">
        <p class="placeholder">Search to view info</p>
      </div>
    </article>

    <article class="info-card reports-card">
      <div class="card-header">
        <div>
          <p class="eyebrow">Your Recent Reports</p>
          <h2>Active maintenance requests</h2>
        </div>
      </div>

      <div class="report-list">
        <div class="report-item">
          <div>
            <h3></h3>
            <p></p>
          </div>
          <span class="status-badge"></span>
        </div>
      </div>
    </article>
  </div>
</div>
